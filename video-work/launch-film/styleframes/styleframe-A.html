<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <title>Styleframe A — gallery-dark triptych</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
        background-color: #17130E;
        font-family: Georgia, "Times New Roman", serif;
      }
      #main-composition { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* warm faint grain */
      .grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: 0.06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 220px 220px;
      }
      /* soft top light, like a wall wash */
      .wash {
        position: absolute; inset: 0; pointer-events: none; z-index: 1;
        background: radial-gradient(120% 80% at 50% 8%, rgba(255,247,235,0.06), rgba(0,0,0,0) 60%);
      }

      .thesis {
        position: absolute; top: 118px; left: 0; right: 0; text-align: center;
        color: #9A9186; font-size: 44px; line-height: 1.25; letter-spacing: 0.2px;
        z-index: 20;
      }
      .thesis b { color: #F4EFE6; font-weight: 600; }

      .rail {
        position: absolute; top: 322px; left: 240px; width: 1440px; height: 440px;
        display: flex; justify-content: space-between; z-index: 20;
      }
      .frame {
        width: 440px; height: 440px; border-radius: 14px; overflow: hidden;
        box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(244,239,230,0.08) inset;
        background: #000;
      }
      .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .placards {
        position: absolute; top: 800px; left: 240px; width: 1440px; height: 40px;
        display: flex; justify-content: space-between; z-index: 20;
      }
      .placard {
        width: 440px; text-align: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 21px; letter-spacing: 0.5px; color: #B7AE9F;
      }

      .subline {
        position: absolute; top: 928px; left: 0; right: 0; text-align: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 22px; color: #7C746A; letter-spacing: 0.3px; z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="main-composition" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="1">
      <div class="wash"></div>

      <div class="thesis">One free plugin directed all three, <b>each in its own look.</b></div>

      <div class="rail">
        <div class="frame"><img src="assets/ex-ledgerline.png" alt="Ledgerline" /></div>
        <div class="frame"><img src="assets/ex-steepwell.png" alt="Steepwell" /></div>
        <div class="frame"><img src="assets/ex-fern.png" alt="Fern & Field" /></div>
      </div>

      <div class="placards">
        <div class="placard">Ledgerline · bookkeeping app</div>
        <div class="placard">Steepwell · loose-leaf tea</div>
        <div class="placard">Fern &amp; Field · garden supply</div>
      </div>

      <div class="subline">a 15-minute brand interview, then every video ships in your look</div>

      <div class="grain"></div>
      <script>
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = (window.gsap ? gsap.timeline({paused:true}) : {progress(){},pause(){},seek(){},kill(){}});
      </script>
    </div>
  </body>
</html>
