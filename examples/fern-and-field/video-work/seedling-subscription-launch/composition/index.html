<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Fern &amp; Field — Seedling Subscription Launch Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      /* full-bleed paper world (fill on a child, never the root) */
      .paper {
        position: absolute;
        inset: 0;
        background-color: #faf7f0;
        /* very subtle dot texture, never busy */
        background-image: radial-gradient(#e7e0d2 1.1px, transparent 1.2px);
        background-size: 34px 34px;
      }
      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 120px 110px;
        box-sizing: border-box;
        text-align: center;
      }
      .wordmark {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 40px;
        letter-spacing: 2px;
        color: #22291f;
        margin: 0;
      }
      .wordmark #amp {
        color: #22291f; /* held neutral; turns green only on resolve */
      }
      .headline {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 78px;
        line-height: 1.05;
        color: #22291f;
        margin: 70px 0 0 0;
        max-width: 820px;
        font-weight: 500;
      }
      .seedling {
        margin-top: 54px;
        width: 150px;
        height: 172px;
      }
      .details {
        list-style: none;
        padding: 0;
        margin: 48px 0 0 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 32px;
        line-height: 1.9;
        color: #4b5343;
      }
      .details li {
        margin: 0;
      }
      .price {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 96px;
        font-weight: 600;
        color: #2f6b4f; /* THE accent, reserved for the punchline */
        margin: 44px 0 0 0;
      }
      .price small {
        font-size: 42px;
        font-weight: 500;
      }
      .url {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 30px;
        letter-spacing: 1px;
        color: #6b7360;
        margin: 26px 0 0 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1080"
      data-duration="11"
    >
      <section id="card" class="clip" data-start="0" data-duration="11" data-track-index="1">
        <div class="paper"></div>
        <div class="card">
          <p id="wordmark" class="wordmark">Fern <span id="amp">&amp;</span> Field</p>
          <h1 id="headline" class="headline">The Seedling Subscription</h1>

          <!-- charm: a seedling sprouting. Sage naturals, NOT the accent green. -->
          <svg id="seedling" class="seedling" viewBox="0 0 150 172" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- soil line -->
            <rect id="soil" x="30" y="162" width="90" height="6" rx="3" fill="#cbb79a" />
            <!-- stem grows up from the soil -->
            <rect id="stem" x="72" y="66" width="6" height="98" rx="3" fill="#7a6a55" />
            <!-- left leaf -->
            <path
              id="leaf-left"
              d="M75 92 C 48 84, 30 96, 26 116 C 52 122, 71 112, 75 92 Z"
              fill="#8fa97e"
            />
            <!-- right leaf -->
            <path
              id="leaf-right"
              d="M75 80 C 102 72, 120 84, 124 104 C 98 110, 79 100, 75 80 Z"
              fill="#8fa97e"
            />
          </svg>

          <ul id="details" class="details">
            <li id="d1">Native plant plugs, delivered to your door</li>
            <li id="d2">A new region-native species every month</li>
            <li id="d3">Starts March 1</li>
          </ul>

          <p id="price" class="price">$24<small>/mo</small></p>
          <p id="url" class="url">fernandfield.com</p>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const GREEN = "#2f6b4f";
      const MOSS = "#22291f";

      // resting state for animated-in elements
      gsap.set(["#wordmark", "#headline", "#d1", "#d2", "#d3", "#price", "#url"], { opacity: 0 });
      gsap.set("#url", { y: 12 });
      // seedling starts collapsed
      gsap.set("#stem", { transformOrigin: "50% 100%", scaleY: 0 });
      gsap.set(["#leaf-left", "#leaf-right"], { transformOrigin: "50% 100%", scale: 0, opacity: 0 });
      gsap.set("#soil", { transformOrigin: "50% 100%", scaleX: 0 });

      // 1. wordmark settles (0.0)
      tl.to("#wordmark", { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.0)
        .from("#wordmark", { y: 20, duration: 0.7, ease: "power2.out" }, 0.0);

      // 2. headline (1.2)
      tl.to("#headline", { opacity: 1, duration: 0.7, ease: "power2.out" }, 1.2)
        .from("#headline", { y: 30, duration: 0.7, ease: "power2.out" }, 1.2);

      // 3. seedling sprouts — the one charm (2.6)
      tl.to("#soil", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.6);
      tl.to("#stem", { scaleY: 1, duration: 0.8, ease: "power2.out" }, 2.9);
      tl.to("#leaf-left", { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 3.5);
      tl.to("#leaf-right", { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 3.75);

      // 4. detail list, staggered (4.6)
      tl.to("#d1", { opacity: 1, duration: 0.55, ease: "power2.out" }, 4.6)
        .from("#d1", { y: 16, duration: 0.55, ease: "power2.out" }, 4.6);
      tl.to("#d2", { opacity: 1, duration: 0.55, ease: "power2.out" }, 4.9)
        .from("#d2", { y: 16, duration: 0.55, ease: "power2.out" }, 4.9);
      tl.to("#d3", { opacity: 1, duration: 0.55, ease: "power2.out" }, 5.2)
        .from("#d3", { y: 16, duration: 0.55, ease: "power2.out" }, 5.2);

      // 5. price lands last — THE green accent (6.6)
      tl.to("#price", { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.6)
        .from("#price", { scale: 0.72, duration: 0.8, ease: "back.out(1.5)" }, 6.6);

      // 6. resolve (9.0): hard-hand the green from price to the wordmark "&".
      //    price snaps neutral + dims FIRST so only one green is ever meaning-bearing.
      tl.set("#price", { color: MOSS }, 9.0);
      tl.to("#price", { opacity: 0.5, duration: 0.5, ease: "power1.inOut" }, 9.0);
      tl.to("#amp", { color: GREEN, duration: 0.6, ease: "power2.out" }, 9.15);
      tl.to("#url", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 9.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
